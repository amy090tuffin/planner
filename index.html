    <input type="text" id="prName" value="${p ? p.name.replace(/"/g,'&quot;') : ''}">
    <label>Category</label>
    <select id="prCat">${Object.entries(CAT_LABELS).map(([k,v]) => `<option value="${k}" ${p && p.cat===k?'selected':''}>${v}</option>`).join('')}</select>
    <label>Group</label>
    <select id="prGroup">
      ${['Environment','Personal care','Admin','Creativity','Other'].map(g => `<option ${p && p.group===g?'selected':''}>${g}</option>`).join('')}
    </select>
    <label>Duration (minutes)</label>
    <input type="number" id="prDur" value="${p ? Math.round(p.duration*60) : 30}" min="5" step="5">
    <label>Cadence description</label>
    <input type="text" id="prCadence" value="${p ? p.cadence.replace(/"/g,'&quot;') : 'daily'}">
    <label>Days of week</label>
    <div style="margin-bottom:10px;">${dayChecks}</div>
    <label>Time (leave blank for draggable)</label>
    <input type="time" id="prTime" value="${p && p.time ? p.time : ''}">
    <label>Notes</label>
    <textarea id="prNote">${p ? (p.note || '') : ''}</textarea>
    <div class="modal-actions">
      ${p ? `<button class="btn-danger" onclick="deletePreset('${p.id}')">Delete</button>` : ''}
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="savePreset('${p ? p.id : ''}')">Save</button>
    </div>
  `;
  document.getElementById('modalBg').classList.add('show');
}

function savePreset(presetId) {
  const days = [];
  document.querySelectorAll('[data-day]').forEach(cb => { if (cb.checked) days.push(parseInt(cb.dataset.day)); });
  const data = {
    name: document.getElementById('prName').value.trim() || 'Untitled',
    cat: document.getElementById('prCat').value,
    group: document.getElementById('prGroup').value,
    duration: parseInt(document.getElementById('prDur').value) / 60,
    cadence: document.getElementById('prCadence').value.trim() || 'daily',
    days: days.length ? days : null,
    time: document.getElementById('prTime').value || null,
    note: document.getElementById('prNote').value.trim()
  };
  if (presetId) {
    const p = state.presets.find(x => x.id === presetId);
    Object.assign(p, data);   // keep existing p.active — editing must not silently un-pause a preset
  } else {
    state.presets.push({ id: 'p_' + Date.now(), active: true, ...data });
  }
  // Re-sync every placed event to the new definition, then refresh all views.
  resyncPresetEvents();
  closeModal();
  refreshAfterPresetChange();
  showToast('Preset saved');
}

function deletePreset(presetId) {
  state.presets = state.presets.filter(p => p.id !== presetId);
  resyncPresetEvents();
  closeModal();
  refreshAfterPresetChange();
  showToast('Preset deleted');
}

// Refresh every view that a preset change can affect, regardless of which
// screen is currently open.
function refreshAfterPresetChange() {
  renderPresets();
  renderTray();
  renderCalendar();
  if (typeof activeScreen !== 'undefined' && activeScreen === 'week') {
    updateWeekHeader();
    renderWeek();
  }
}

// ============ REFLECT ============
function renderReflect() {
  // Aggregate this week's events
  const cur = new Date(state.currentDay);
  const dayIdx = (cur.getDay() + 6) % 7;
  const monday = new Date(cur.getTime() - dayIdx * 86400000);
  const days = [];
  for (let i = 0; i < 7; i++) days.push(new Date(monday.getTime() + i * 86400000));
  // Per-category hours: completed (events marked done) and planned (all scheduled
  // events this week, done + upcoming = where you'll land if you follow the plan).
  const completedH = {};
  const plannedH = {};
  let totalCompleted = 0;
  let totalPlanned = 0;
  days.forEach(d => {
    getEvents(d).forEach(e => {
      const c = catCode(e.cat);
      const dur = e.duration || 0;
      plannedH[c] = (plannedH[c] || 0) + dur;
      totalPlanned += dur;
      if (e.completed) {
        completedH[c] = (completedH[c] || 0) + dur;
        totalCompleted += dur;
      }
    });
  });

  // Weekly goals. type 'target' = want to reach the number (green as you near it);
  // type 'cap' = want to stay under it (amber near, red at/over).
  const GOALS = [
    { cat: 'career',     type: 'target', hours: 20 },
    { cat: 'creativity', type: 'target', hours: 15 },
    { cat: 'relaxation', type: 'target', hours: 7 },
    { cat: 'fitness',    type: 'target', hours: 13 },
    { cat: 'housework',  type: 'cap',    hours: 10 },
    { cat: 'grooming',   type: 'cap',    hours: 5 },
    { cat: 'admin',      type: 'cap',    hours: 3.5 },
    { cat: 'social',     type: 'cap',    hours: 7 }
  ];
  const goalCats = new Set(GOALS.map(g => g.cat));

  // Build a tracked row: two bars (completed, planned) scaled so the goal hours
  // sit at 100% of the track. Bars can exceed 100% (clamped visually) to show
  // overshoot. A marker line sits at the goal position.
  // Build a single category row for either the "completed" or "planned" mode.
  // completed mode: hours done + a completed bar.
  // planned mode:   planned as a % of the target/cap + a planned bar, plus the
  //                 status line (where you'll land if you follow the plan).
  function trackRow(g, mode) {
    const done = completedH[g.cat] || 0;
    const plan = plannedH[g.cat] || 0;
    const color = catColor(g.cat);
    const scaleMax = Math.max(g.hours, plan, done);   // longest thing on the track
    const goalPct = scaleMax > 0 ? (g.hours / scaleMax * 100) : 100;
    const donePct = scaleMax > 0 ? Math.min(100, done / scaleMax * 100) : 0;
    const planPct = scaleMax > 0 ? Math.min(100, plan / scaleMax * 100) : 0;
    const goalLabel = g.type === 'target' ? `target ${formatDuration(g.hours)}` : `cap ${formatDuration(g.hours)}`;

    if (mode === 'completed') {
      return `
      <div class="track-row">
        <div class="track-head">
          <span class="track-name">${catLabel(g.cat)}</span>
          <span class="track-fig"><span class="strong">${formatDuration(done)}</span> done · ${goalLabel}</span>
        </div>
        <div class="track-track" title="Completed: ${formatDuration(done)}">
          <div class="track-fill" style="width:${donePct}%; background:${color};"></div>
          <div class="track-marker" style="left:${goalPct}%;"></div>
        </div>
      </div>`;
    }

    // planned mode — percentage of target/cap reached
    const pct = g.hours > 0 ? Math.round(plan / g.hours * 100) : 0;
    const pctLabel = g.type === 'target'
      ? `${pct}% of ${formatDuration(g.hours)} target`
      : `${pct}% of ${formatDuration(g.hours)} cap`;

    // Status + colour by goal type, judged on PLANNED (where you'll land).
    let statusClass, statusText;
    if (g.type === 'target') {
      const remaining = g.hours - plan;
      if (plan >= g.hours) { statusClass = 'good'; statusText = `On track to hit ${g.hours}h ✓`; }
      else if (plan >= g.hours * 0.8) { statusClass = 'warn'; statusText = `${formatDuration(remaining)} short of ${g.hours}h target`; }
      else { statusClass = 'neutral'; statusText = `${formatDuration(remaining)} more planned needed to hit ${g.hours}h`; }
    } else { // cap
      if (plan > g.hours) { statusClass = 'over'; statusText = `${formatDuration(plan - g.hours)} over the ${g.hours}h cap`; }
      else if (plan >= g.hours * 0.8) { statusClass = 'warn'; statusText = `Near the ${g.hours}h cap`; }
      else { statusClass = 'good'; statusText = `Under the ${g.hours}h cap ✓`; }
    }

    return `
      <div class="track-row">
        <div class="track-head">
          <span class="track-name">${catLabel(g.cat)}</span>
          <span class="track-fig"><span class="strong">${pctLabel}</span> · ${formatDuration(plan)} planned</span>
        </div>
        <div class="track-track" title="Planned: ${formatDuration(plan)}">
          <div class="track-fill planned" style="width:${planPct}%; background:${color};"></div>
          <div class="track-marker" style="left:${goalPct}%;"></div>
        </div>
        <div class="track-status ${statusClass}">${statusText}</div>
      </div>`;
  }

  const targetGoals = GOALS.filter(g => g.type === 'target');
  const capGoals = GOALS.filter(g => g.type === 'cap');

  // Any time spent in categories without a goal (e.g. Appointment), shown neutrally.
  const otherCats = Object.keys(plannedH)
    .filter(c => !goalCats.has(c))
    .sort((a,b) => (plannedH[b]||0)-(plannedH[a]||0));

  function otherRow(c, mode) {
    const fig = mode === 'completed'
      ? `<span class="strong">${formatDuration(completedH[c]||0)}</span> done`
      : `<span class="strong">${formatDuration(plannedH[c]||0)}</span> planned`;
    const width = mode === 'completed'
      ? ((plannedH[c]||0) > 0 ? Math.min(100, (completedH[c]||0)/(plannedH[c]||1)*100) : 0)
      : 100;
    return `
      <div class="track-row">
        <div class="track-head">
          <span class="track-name">${catLabel(c)}</span>
          <span class="track-fig">${fig}</span>
        </div>
        <div class="track-track"><div class="track-fill" style="width:${width}%; background:${catColor(c)}; opacity:0.5;"></div></div>
      </div>`;
  }

  // Build the three sub-groups for a given mode ('completed' | 'planned').
  function sectionBody(mode) {
    const targetRows = targetGoals.map(g => trackRow(g, mode)).join('');
    const capRows = capGoals.map(g => trackRow(g, mode)).join('');
    const otherRows = otherCats.map(c => otherRow(c, mode)).join('');
    return `<div class="track-section-label">Aiming to hit</div>${targetRows}` +
      `<div class="track-section-label" style="margin-top:14px;">Keeping under</div>${capRows}` +
      (otherRows ? `<div class="track-section-label" style="margin-top:14px;">Other</div>${otherRows}` : '');
  }

  const bars = document.getElementById('categoryBars');
  if (totalPlanned === 0) {
    bars.innerHTML = '<div style="font-size:12px; color:#888;">Schedule tasks this week to see how you\'re tracking against your goals.</div>';
  } else {
    bars.innerHTML =
      `<div class="track-section-title">Completed</div>${sectionBody('completed')}` +
      `<div class="track-section-title">Planned</div>${sectionBody('planned')}`;
  }

  document.getElementById('totalScheduled').textContent =
    `${formatDuration(totalCompleted)} completed so far · ${formatDuration(totalPlanned)} planned this week`;
}

// ============ QUICK ADD ============
document.getElementById('inboxAddBtn').addEventListener('click', () => {
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <h3>Quick add</h3>
    <label>What needs to get done?</label>
    <input type="text" id="qaText" placeholder="e.g. Email Anna">
    <label>Category</label>
    <select id="qaCat">${Object.entries(CAT_LABELS).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}</select>
    <label>Duration (minutes)</label>
    <input type="number" id="qaDur" value="30" min="5" step="5">
    <label>Notes (optional)</label>
    <textarea id="qaNote"></textarea>
    <div style="font-size:11px; color:#888; margin-bottom:8px;">Adds to inbox. Drag to Today to schedule.</div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="addInbox()">Add</button>
    </div>
  `;
  document.getElementById('modalBg').classList.add('show');
});

function addInbox() {
  const text = document.getElementById('qaText').value.trim();
  const cat = document.getElementById('qaCat').value;
  const dur = parseInt(document.getElementById('qaDur').value) / 60;
  const note = document.getElementById('qaNote').value.trim();
  if (text) {
    state.inbox.unshift({ id: 'i_' + Date.now(), label: text, cat, age: 0, duration: dur, note });
    saveState(); renderInbox(); renderTray();
    showToast('Added to inbox');
  }
  closeModal();
}

function closeModal() { document.getElementById('modalBg').classList.remove('show'); }
document.getElementById('modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal(); });

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => t.classList.remove('show'), 2500);
}

// ============ INIT ============
function renderAll() {
  updateTodayHeader();
  renderCalendar(); renderTray(); updateEodButton();
}

// Auto-run end-of-day catch-up on first load each day
function autoCatchUp() {
  const todayK = dateKey(new Date());
  if (state.lastSeenDate && state.lastSeenDate !== todayK) {
    // Bump age for inbox tasks not scheduled
    state.inbox.forEach(t => { if (!t.scheduledEventId && !t.completed) t.age = (t.age || 0) + 1; });
  }
  state.lastSeenDate = todayK;
  saveState();
}

// Always start on actual today
state.currentDay = new Date();
saveState();
autoCatchUp();
// Reconcile every already-placed event with the CURRENT preset definitions on
// each load, so future weeks reflect preset changes even if they were made
// before this code shipped, or in an earlier session. Safe: today-forward only,
// completed events preserved, idempotent.
resyncPresetEvents();
renderAll();
updateScheduledTime();

// Register service worker for offline support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .catch(err => { console.log('SW registration failed:', err); });
  });
}

</script>
