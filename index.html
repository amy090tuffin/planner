<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6b5b3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Personal Planner</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #e8e6e1; color: #2a2a2a; overflow: hidden; overscroll-behavior: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }

  .phone {
    width: 100%; max-width: 430px; height: 100vh; margin: 0 auto; background: #faf8f3;
    overflow: hidden; position: relative; display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  @media (min-width: 500px) {
    body { background: #e8e6e1; padding: 20px 0; }
    .phone { height: calc(100vh - 40px); border-radius: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); border: 6px solid #1a1a1a; }
  }

  .header { padding: 14px 20px 10px; background: #faf8f3; border-bottom: 1px solid #ece8de; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .header .date { font-size: 12px; color: #888; margin-top: 2px; }
  .header-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #555; padding: 4px 10px; min-width: 40px; min-height: 40px; }
  .scheduled-time { font-size: 11px; color: #6b5b3f; font-weight: 600; padding: 6px 10px; text-align: right; min-width: 40px; line-height: 1.1; }
  .scheduled-time .num { font-size: 14px; display: block; }
  .scheduled-time .lbl { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 0.4px; }
  .scheduled-time.busy { color: #c04040; }
  .scheduled-time.busy .lbl { color: #c04040; opacity: 0.85; }
  .inbox-add-btn { display: block; width: calc(100% - 24px); margin: 12px; background: #6b5b3f; color: #faf8f3; border: none; border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 44px; }
  .day-nav { display: flex; gap: 6px; align-items: center; }
  .day-nav button { background: #f3f0e8; border: none; width: 32px; height: 32px; border-radius: 16px; font-size: 16px; cursor: pointer; color: #6b5b3f; }

  .content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; position: relative; min-height: 0; }
  .screen { display: none; min-height: 100%; }
  .screen.active { display: flex; flex-direction: column; }
  .screen#screen-today.active { height: 100%; overflow: hidden; }
  .screen#screen-today.active .today-layout { height: 100%; min-height: 0; }

  .tabs { display: flex; background: #f3f0e8; border-top: 1px solid #ece8de; flex-shrink: 0; padding: 6px 0 8px; }
  .tab { flex: 1; text-align: center; padding: 4px 0; background: none; border: none; cursor: pointer; font-size: 10px; color: #888; font-weight: 500; min-height: 44px; }
  .tab .icon { display: block; font-size: 18px; margin-bottom: 1px; }
  .tab.active { color: #6b5b3f; }

  /* TODAY */
  .today-layout { display: flex; flex-direction: column; height: 100%; min-height: 100%; }
  .calendar-area { padding: 0 12px 8px; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .hour-row { display: flex; min-height: 40px; position: relative; }
  .hour-row.is-hour { border-top: 1px solid #d9d2c2; }
  .hour-row.is-half { border-top: 1px dashed #ece5d3; }
  .hour-label { width: 48px; font-size: 11px; color: #aaa; padding-top: 4px; flex-shrink: 0; }
  .hour-label.half { font-size: 10px; color: #c4bda8; }
  .hour-slot { flex: 1; min-height: 40px; padding: 2px; position: relative; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
  .hour-slot.drop-target { background: #fff4d6; border-radius: 8px; outline: 2px dashed #c0a060; }
  .hour-slot:hover { background: rgba(196, 175, 130, 0.08); }
  .hour-slot.has-events { cursor: default; }
  .hour-slot.has-events:hover { background: transparent; }
  .hour-slot.covered { cursor: default; }
  .hour-slot.covered:hover { background: transparent; }

  .event {
    background: #d4c5a0; color: #3a3020; border-radius: 8px;
    padding: 6px 28px 6px 10px; margin: 1px 0; font-size: 13px; font-weight: 500;
    position: relative; touch-action: pan-y;
  }
  /* Sized events use absolute positioning so they can overflow their origin slot
     without affecting the grid layout (each row stays at 40px). */
  .event.sized {
    position: absolute; left: 2px; right: 2px; top: 2px;
    margin: 0; z-index: 2; overflow: hidden;
  }
  .event.cat-career { background: #c4b5d4; color: #2a1f3a; }
  .event.cat-fitness { background: #b5d4c4; color: #1f3a2a; }
  .event.cat-social { background: #d4b5c4; color: #3a1f2a; }
  .event.cat-appt { background: #b5c4d4; color: #1f2a3a; }
  .event.cat-housework { background: #e3a9a0; color: #4a1f1a; }
  .event.cat-grooming { background: #e8d488; color: #4a3a10; }
  .event.cat-admin { background: #b89878; color: #3a2410; }
  .event.cat-creativity { background: #b8c8d8; color: #1f2838; }
  .event.cat-relaxation { background: #ffffff; color: #2a2a2a; border: 1px solid #cfc8b8; }
  .event .time { font-size: 10px; opacity: 0.7; }
  .event .cat { font-size: 9px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.5px; }
  .event .note-icon { font-size: 10px; margin-left: 4px; opacity: 0.8; }
  .event.completed { opacity: 0.5; text-decoration: line-through; }
  .event.missed { opacity: 0.55; border: 1px dashed #c08040; }
  .event.missed::after { content: 'missed — back in inbox'; position: absolute; bottom: 2px; right: 8px; font-size: 9px; color: #c08040; font-style: italic; }
  .event .complete-btn {
    position: absolute; top: 6px; right: 6px; width: 22px; height: 22px;
    border-radius: 50%; border: 1.5px solid currentColor; background: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: inherit; padding: 0;
  }
  .event.completed .complete-btn { background: currentColor; }
  .event.completed .complete-btn::before { content: '✓'; color: #faf8f3; }
  .event.dragging-touch { opacity: 0.9; transform: scale(1.04); box-shadow: 0 8px 20px rgba(0,0,0,0.25); z-index: 1000; position: fixed; pointer-events: none; }

  /* Tray (top, fixed) */
  .tray { background: #f3f0e8; border-bottom: 1px solid #ece8de; padding: 8px 12px 6px; flex-shrink: 0; max-height: 160px; overflow: hidden; display: flex; flex-direction: column; }
  .tray-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .tray-title { font-size: 12px; font-weight: 700; color: #4a3f25; letter-spacing: 0.3px; }
  .tray-tabs { display: flex; gap: 4px; }
  .tray-tab { padding: 4px 10px; background: #e8e3d5; border: none; border-radius: 12px; font-size: 11px; cursor: pointer; color: #6b5b3f; min-height: 28px; }
  .tray-tab.active { background: #6b5b3f; color: #faf8f3; }
  .tray-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 6px; -webkit-overflow-scrolling: touch; }
  .tray-scroll::-webkit-scrollbar { display: none; }
  .tray-item {
    flex-shrink: 0; background: white; border: 1px solid #ece8de;
    border-radius: 10px; padding: 8px 12px; min-width: 110px; max-width: 160px;
    font-size: 12px; position: relative; touch-action: pan-x;
  }
  .tray-item .label { font-weight: 500; margin-bottom: 2px; line-height: 1.2; }
  .tray-item .meta { font-size: 10px; color: #999; }
  .tray-item.cat-career { border-left: 3px solid #8b6db8; }
  .tray-item.cat-fitness { border-left: 3px solid #5b9b7b; }
  .tray-item.cat-social { border-left: 3px solid #b86888; }
  .tray-item.cat-housework { border-left: 3px solid #c0524a; }
  .tray-item.cat-grooming { border-left: 3px solid #d4b94a; }
  .tray-item.cat-admin { border-left: 3px solid #8a5a2a; }
  .tray-item.cat-creativity { border-left: 3px solid #6888b8; }
  .tray-item.cat-relaxation { border-left: 3px solid #b8b0a0; }
  .tray-item .age { font-size: 9px; color: #c08040; font-weight: 600; margin-top: 2px; }
  .tray-item.dragging-touch { opacity: 0.9; transform: scale(1.08); box-shadow: 0 8px 20px rgba(0,0,0,0.25); z-index: 1000; position: fixed; pointer-events: none; }
  .tray-item.allocated { opacity: 0.5; background: #f3f0e8; cursor: pointer; }
  .tray-item.allocated .label { text-decoration: line-through; }
  .tray-item.allocated .allocated-tag { font-size: 9px; color: #6b5b3f; font-weight: 600; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.3px; }
  .tray-item-close { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border: none; background: transparent; color: #aaa; cursor: pointer; font-size: 14px; line-height: 1; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .tray-item-close:hover { background: rgba(0,0,0,0.06); color: #c04040; }
  .tray-item { padding-right: 24px; }

  .checkout-prompt { background: linear-gradient(135deg, #f9f3e3 0%, #f0ece2 100%); border-top: 1px solid #ece8de; padding: 10px 12px; flex-shrink: 0; }
  .checkout-prompt h4 { margin: 0 0 2px; font-size: 13px; color: #4a3f25; }
  .checkout-prompt p { margin: 0; font-size: 11px; color: #888; }
  .checkout-prompt button { background: #6b5b3f; color: #faf8f3; border: none; padding: 8px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; min-height: 36px; white-space: nowrap; }
  .checkout-prompt .row { display: flex; gap: 10px; align-items: center; }
  .checkout-prompt .row > div { cursor: pointer; flex: 1; }

  /* WEEK */
  .week-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 10px 8px; }
  .week-scroll::-webkit-scrollbar { height: 6px; }
  .week-scroll::-webkit-scrollbar-thumb { background: #d4cdb8; border-radius: 3px; }
  .week-grid { display: grid; grid-template-columns: 36px repeat(7, minmax(54px, 1fr)); gap: 1px; background: #ece8de; min-width: 100%; }
  @media (orientation: landscape) and (max-width: 900px) {
    body { padding: 0; }
    .phone { max-width: 100%; height: 100vh; border-radius: 0; border: none; box-shadow: none; }
    .week-grid { grid-template-columns: 44px repeat(7, 1fr); }
  }
  .week-day-header { background: #faf8f3; text-align: center; padding: 6px 1px; font-size: 9px; font-weight: 600; color: #6b5b3f; text-transform: uppercase; cursor: pointer; }
  .week-day-header.today { background: #6b5b3f; color: #faf8f3; border-radius: 4px; }
  .week-day-header .num { font-size: 14px; display: block; margin-top: 1px; }
  .week-hour-label { background: #faf8f3; font-size: 8px; color: #aaa; padding: 2px 1px; text-align: right; }
  .week-cell { background: #faf8f3; min-height: 26px; padding: 1px; position: relative; cursor: pointer; }
  .week-event { border-radius: 3px; padding: 1px 2px; font-size: 8px; font-weight: 500; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .week-cell { overflow: visible; }
  .week-event-tall { position: absolute; left: 1px; right: 1px; z-index: 2; white-space: normal; text-overflow: clip; box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
  /* Continuous per-day timeline (Outlook-style): events positioned by real start/end. */
  .week-times { background: #faf8f3; }
  .week-hr { height: 26px; box-sizing: border-box; font-size: 8px; color: #aaa; text-align: right; padding: 1px 2px 0 0; }
  .week-daycol { background: #faf8f3; position: relative; overflow: visible; background-image: linear-gradient(to bottom, #ece8de 0, #ece8de 1px, transparent 1px); background-size: 100% 26px; }
  .week-event.cat-career { background: #c4b5d4; }
  .week-event.cat-fitness { background: #b5d4c4; }
  .week-event.cat-social { background: #d4b5c4; }
  .week-event.cat-housework { background: #e3a9a0; }
  .week-event.cat-grooming { background: #e8d488; }
  .week-event.cat-admin { background: #b89878; }
  .week-event.cat-creativity { background: #b8c8d8; }
  .week-event.cat-relaxation { background: #ffffff; border: 1px solid #cfc8b8; }
  .week-event.cat-appt { background: #b5c4d4; }

  /* INBOX */
  .inbox-list { padding: 12px; }
  .inbox-section { margin-bottom: 20px; }
  .inbox-section h3 { font-size: 11px; font-weight: 600; color: #6b5b3f; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 8px; }
  .inbox-item { background: white; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; border: 1px solid #ece8de; display: flex; align-items: center; gap: 10px; }
  .inbox-item.cat-career { border-left: 4px solid #8b6db8; }
  .inbox-item.cat-fitness { border-left: 4px solid #5b9b7b; }
  .inbox-item.cat-social { border-left: 4px solid #b86888; }
  .inbox-item.cat-housework { border-left: 4px solid #c0524a; }
  .inbox-item.cat-grooming { border-left: 4px solid #d4b94a; }
  .inbox-item.cat-admin { border-left: 4px solid #8a5a2a; }
  .inbox-item.cat-creativity { border-left: 4px solid #6888b8; }
  .inbox-item.cat-relaxation { border-left: 4px solid #b8b0a0; }
  .inbox-item .label { font-size: 14px; font-weight: 500; }
  .inbox-item .meta { font-size: 11px; color: #999; margin-top: 2px; }
  .inbox-item.stale { background: #fdf6e9; }
  .inbox-item .actions { display: flex; gap: 6px; }
  .inbox-item .actions button { background: #f3f0e8; border: none; padding: 8px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; color: #6b5b3f; min-height: 32px; }
  .inbox-item { touch-action: pan-y; }
  .inbox-item .drag-handle { flex: 0 0 auto; width: 28px; min-height: 36px; display: flex; align-items: center; justify-content: center; color: #c7c0b2; font-size: 16px; cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; }
  .inbox-item.dragging { opacity: 0.85; box-shadow: 0 6px 18px rgba(0,0,0,0.18); transform: scale(1.02); position: relative; z-index: 5; }
  .inbox-item.drag-ghost { opacity: 0.35; }

  .triage-banner { background: #fdf6e9; border: 1px solid #e8d8a8; border-radius: 12px; padding: 12px; margin: 12px 12px 4px; font-size: 12px; color: #6b5b3f; }
  .triage-banner b { color: #4a3f25; }

  /* PRESETS */
  .presets-list { padding: 12px; }
  .preset-group-header { font-size: 11px; font-weight: 600; color: #6b5b3f; text-transform: uppercase; letter-spacing: 0.5px; margin: 12px 4px 6px; }
  .preset-item { background: white; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; border: 1px solid #ece8de; }
  .preset-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 8px; }
  .preset-name { font-size: 14px; font-weight: 600; flex: 1; }
  .preset-toggle { width: 40px; height: 22px; background: #6b5b3f; border-radius: 11px; position: relative; cursor: pointer; border: none; padding: 0; flex-shrink: 0; }
  .preset-toggle::after { content: ''; position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; background: white; border-radius: 50%; }
  .preset-toggle.off { background: #d4ccb8; }
  .preset-toggle.off::after { left: 2px; right: auto; }
  .preset-meta { font-size: 11px; color: #888; }
  .preset-cadence { font-size: 11px; color: #6b5b3f; margin-top: 4px; }
  .preset-time { font-size: 11px; color: #4a3f25; margin-top: 2px; font-weight: 500; }
  .preset-note { font-size: 11px; color: #8b6d3f; margin-top: 4px; font-style: italic; background: #fdf6e9; padding: 4px 6px; border-radius: 4px; }
  .preset-skip-warning { background: #fdf6e9; border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 11px; color: #8b6d3f; }
  .preset-edit-link { font-size: 11px; color: #6b5b3f; cursor: pointer; text-decoration: underline; margin-top: 6px; display: inline-block; }

  .add-preset-btn { background: #faf8f3; border: 1.5px dashed #c0b89c; padding: 14px; text-align: center; color: #888; font-size: 13px; border-radius: 12px; width: 100%; cursor: pointer; margin-top: 8px; }

  /* REFLECT */
  .reflect-area { padding: 12px; }
  .reflect-card { background: white; border-radius: 16px; padding: 14px; margin-bottom: 12px; border: 1px solid #ece8de; }
  .reflect-card h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: #4a3f25; }
  .category-bar-row { display: flex; align-items: center; margin-bottom: 8px; gap: 8px; font-size: 12px; }
  .category-bar-row .name { width: 80px; font-size: 11px; }
  .category-bar-row .bar { flex: 1; height: 8px; background: #f0ece2; border-radius: 4px; overflow: hidden; }
  .category-bar-row .fill { height: 100%; border-radius: 4px; }
  .category-bar-row .hours { width: 36px; text-align: right; font-size: 11px; color: #888; }
  /* Stacked single-bar view */
  .stack-bar { display: flex; width: 100%; height: 14px; background: #f0ece2; border-radius: 7px; overflow: hidden; }
  .stack-seg { height: 100%; }
  .stack-legend { margin-top: 12px; }
  .stack-legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 6px; }
  .stack-legend-row .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .stack-legend-row .name { flex: 1; font-size: 11px; color: #4a3f25; }
  .stack-legend-row .hours { font-size: 11px; color: #888; }
  /* Target/cap tracking bars */
  .track-legend-key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 10px; color: #888; margin-bottom: 14px; }
  .track-legend-key .key-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .track-legend-key .key-done { background: #6b5b3f; }
  .track-legend-key .key-planned { background: #cfc4ad; }
  .track-legend-key .key-target { color: #888; }
  .track-section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #a99; color: #b0a78f; margin: 4px 0 8px; }
  .track-section-title { font-size: 13px; font-weight: 700; color: #4a3f25; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid #e7e0cf; }
  .track-section-title:not(:first-child) { margin-top: 24px; }
  .track-row { margin-bottom: 14px; }
  .track-row .track-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .track-row .track-name { font-size: 12px; color: #4a3f25; font-weight: 500; }
  .track-row .track-fig { font-size: 11px; color: #888; }
  .track-row .track-fig .strong { font-weight: 600; }
  .track-track { position: relative; background: #f0ece2; border-radius: 4px; height: 7px; margin-bottom: 3px; }
  .track-track:last-child { margin-bottom: 0; }
  .track-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; min-width: 2px; }
  .track-fill.planned { opacity: 0.45; }
  .track-marker { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #6b5b3f; border-radius: 1px; }
  .track-status { font-size: 10px; margin-top: 4px; }
  .track-status.good { color: #5b9b7b; }
  .track-status.warn { color: #b08040; }
  .track-status.over { color: #b04030; }
  .track-status.neutral { color: #999; }

  /* MODAL */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
  .modal-bg.show { display: flex; }
  .modal { background: #faf8f3; border-radius: 16px; padding: 18px; width: 100%; max-width: 360px; max-height: 80vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 12px; font-size: 16px; }
  .modal input, .modal select, .modal textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 10px; background: white; font-family: inherit; }
  .modal textarea { resize: vertical; min-height: 60px; }
  .modal label { display: block; font-size: 12px; color: #6b5b3f; margin-bottom: 4px; font-weight: 500; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }
  .modal-actions button { padding: 10px 16px; border-radius: 8px; border: none; font-size: 13px; cursor: pointer; min-height: 38px; }
  .btn-primary { background: #6b5b3f; color: #faf8f3; }
  .btn-secondary { background: #ece8de; color: #4a3f25; }
  .btn-danger { background: #d4a8a8; color: #6a2a2a; }

<script>
// ============ CONSTANTS ============
const CAT_LABELS = {
  housework: 'Housework', grooming: 'Grooming', fitness: 'Fitness', admin: 'Admin',
  social: 'Social', career: 'Career', creativity: 'Creativity', relaxation: 'Relaxation', appt: 'Appointment'
};
const CAT_COLORS = {
  housework: '#c0524a', grooming: '#d4b94a', fitness: '#5b9b7b', admin: '#8a5a2a',
  social: '#b86888', career: '#8b6db8', creativity: '#6888b8', relaxation: '#cfc8b8', appt: '#688bb8'
};
const CAT_MIGRATION = {
  env: 'housework', care: 'grooming', health: 'fitness', work: 'career',
  create: 'creativity', personal: 'grooming'
};
function catCode(c) { return CAT_LABELS[c] ? c : (CAT_MIGRATION[c] || c); }
function catLabel(c) { const k = catCode(c); return CAT_LABELS[k] || c || ''; }
function catColor(c) { const k = catCode(c); return CAT_COLORS[k] || '#999'; }
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_NAMES_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ============ DEFAULT PRESETS (Amy's actual list) ============
function defaultPresets() {
  return [
    // Environment
    { id: 'p_chores',  name: 'Chores',  cat: 'housework', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 0.5, time: null, active: true, group: 'Environment' },
    { id: 'p_garden',  name: 'Gardening', cat: 'housework', cadence: 'bi-weekly', days:null, duration: 0.5, time: null, active: true, group: 'Environment' },
    // Personal care — timed
    { id: 'p_morning', name: 'Morning routine', cat: 'grooming', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 10/60, time: '09:30', active: true, group: 'Personal care', note: 'Brush teeth + skincare' },
    { id: 'p_stretch', name: 'Stretches', cat: 'fitness', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 0.5, time: '09:00', active: true, group: 'Personal care' },
    { id: 'p_hair',    name: 'Haircare', cat: 'grooming', cadence: 'Mondays', days:[1], duration: 75/60, time: '20:00', active: true, group: 'Personal care' },
    { id: 'p_moist_m', name: 'Moisturise (Mon)', cat: 'grooming', cadence: 'Mondays after hair', days:[1], duration: 20/60, time: '21:15', active: true, group: 'Personal care' },
    { id: 'p_shave',   name: 'Shave', cat: 'grooming', cadence: 'Thursdays', days:[4], duration: 0.5, time: '20:00', active: true, group: 'Personal care' },
    { id: 'p_groom',   name: 'Personal care', cat: 'grooming', cadence: 'Thursdays', days:[4], duration: 10/60, time: '20:30', active: true, group: 'Personal care' },
    { id: 'p_moist_t', name: 'Moisturise (Thu)', cat: 'grooming', cadence: 'Thursdays after shave', days:[4], duration: 20/60, time: '20:40', active: true, group: 'Personal care' },
    { id: 'p_evening', name: 'Evening routine', cat: 'grooming', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 10/60, time: '22:30', active: true, group: 'Personal care', note: 'Brush teeth + skincare. Wed & Sun: use whitener instead of toothpaste' },
    { id: 'p_foot',    name: 'Footcare', cat: 'grooming', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 5/60, time: '22:40', active: true, group: 'Personal care' },
    // Personal care — draggable
    { id: 'p_workout', name: 'Workout', cat: 'fitness', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 0.5, time: null, active: true, group: 'Personal care' },
    { id: 'p_filenails', name: 'File nails', cat: 'grooming', cadence: 'Fridays', days:[5], duration: 0.5, time: null, active: true, group: 'Personal care' },
    // Admin
    { id: 'p_admin',   name: 'Admin', cat: 'admin', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 20/60, time: null, active: true, group: 'Admin' },
    { id: 'p_corr1',   name: 'Correspondence (am)', cat: 'admin', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 5/60, time: null, active: true, group: 'Admin' },
    { id: 'p_corr2',   name: 'Correspondence (pm)', cat: 'admin', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 5/60, time: null, active: true, group: 'Admin' },
    { id: 'p_mum',     name: 'Call Mum', cat: 'social', cadence: 'Tue & Fri', days:[2,5], duration: 1, time: '19:30', active: true, group: 'Admin' },
    { id: 'p_jobapp',  name: 'Application', cat: 'career', cadence: 'weekdays', days:[1,2,3,4,5], duration: 40/60, time: null, active: true, group: 'Admin' },
    { id: 'p_portfolio', name: 'Portfolio', cat: 'career', cadence: 'weekdays', days:[1,2,3,4,5], duration: 1, time: null, active: true, group: 'Admin' },
    // Creativity & Relaxation
    { id: 'p_read_am', name: 'Reading (am)', cat: 'relaxation', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 0.5, time: null, active: true, group: 'Creativity' },
    { id: 'p_read_pm', name: 'Reading (pm)', cat: 'relaxation', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 0.5, time: null, active: true, group: 'Creativity' },
    { id: 'p_screen',  name: 'Screenplay', cat: 'creativity', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 1, time: null, active: true, group: 'Creativity' },
    { id: 'p_creative', name: 'Arts & crafts', cat: 'creativity', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 0.5, time: null, active: true, group: 'Creativity' },
    // Work (additional)
    { id: 'p_cook',    name: 'Cooking', cat: 'housework', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 45/60, time: null, active: true, group: 'Environment' },
    { id: 'p_home',    name: 'Home improvements', cat: 'housework', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 0.5, time: null, active: true, group: 'Environment' },
  ];
}

// ============ STATE ============
const LS_KEY = 'planner_state_v1';
const MIGRATION_KEY = 'planner_migrations_applied';
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      s.currentDay = new Date(s.currentDay);
      runMigrations(s);
      return s;
    }
  } catch (e) {}
  return {
    currentDay: new Date(),
    trayMode: 'presets',
    eventsByDate: {},
    inbox: [],
    presets: defaultPresets(),
    autoPlacedDates: {},
    lastSeenDate: null
  };
}

// One-time fixes applied to existing user state. Each migration runs once.
function runMigrations(s) {
  const applied = JSON.parse(localStorage.getItem(MIGRATION_KEY) || '[]');
  const apply = (name, fn) => {
    if (!applied.includes(name)) { fn(); applied.push(name); }
  };

  // Fix 1: morning routine should run every day, not exclude Wed & Sun
  apply('morning_routine_all_days_v1', () => {
    const p = (s.presets || []).find(x => x.id === 'p_morning');
    if (p) {
      p.days = [0,1,2,3,4,5,6];
      p.cadence = 'daily';
    }
    // Clear auto-placed flags so morning routine re-places on Wed/Sun
    s.autoPlacedDates = {};
  });

  // Fix 2: undo accidental EOD — clear 'missed' flags on today's events and reset all preset skip streaks
  apply('undo_accidental_eod_v1', () => {
    const todayK = dateKey(new Date());
    const events = (s.eventsByDate && s.eventsByDate[todayK]) || [];
    events.forEach(ev => { if (ev.missed) delete ev.missed; });
    (s.presets || []).forEach(p => { p.skipStreak = 0; });
  });

  // Fix 3: split Reading into am/pm and add Creativity, Cooking, Home improvements presets
  apply('split_reading_add_presets_v1', () => {
    if (!s.presets) s.presets = [];
    const oldRead = s.presets.find(p => p.id === 'p_read');
    if (oldRead) {
      // Replace with two half-hour blocks, preserving active state
      const wasActive = oldRead.active !== false;
      s.presets = s.presets.filter(p => p.id !== 'p_read');
      s.presets.push({ id: 'p_read_am', name: 'Reading (am)', cat: 'create', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 0.5, time: null, active: wasActive, group: 'Creativity & Relaxation' });
      s.presets.push({ id: 'p_read_pm', name: 'Reading (pm)', cat: 'create', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 0.5, time: null, active: wasActive, group: 'Creativity & Relaxation' });
    } else {
      // No old reading preset — ensure the new ones exist
      if (!s.presets.find(p => p.id === 'p_read_am')) {
        s.presets.push({ id: 'p_read_am', name: 'Reading (am)', cat: 'create', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 0.5, time: null, active: true, group: 'Creativity & Relaxation' });
      }
      if (!s.presets.find(p => p.id === 'p_read_pm')) {
        s.presets.push({ id: 'p_read_pm', name: 'Reading (pm)', cat: 'create', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 0.5, time: null, active: true, group: 'Creativity & Relaxation' });
      }
    }
    if (!s.presets.find(p => p.id === 'p_creative')) {
      s.presets.push({ id: 'p_creative', name: 'Creativity', cat: 'create', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 0.5, time: null, active: true, group: 'Creativity & Relaxation' });
    }
    if (!s.presets.find(p => p.id === 'p_cook')) {
      s.presets.push({ id: 'p_cook', name: 'Cooking', cat: 'work', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 45/60, time: null, active: true, group: 'Admin' });
    }
    if (!s.presets.find(p => p.id === 'p_home')) {
      s.presets.push({ id: 'p_home', name: 'Home improvements', cat: 'work', cadence: 'daily', days:[0,1,2,3,4,5,6], duration: 0.5, time: null, active: true, group: 'Admin' });
    }
  });

  // Fix 4: initialise skipDates field on every preset (per-day skip tracking)
  apply('init_skip_dates_v1', () => {
    (s.presets || []).forEach(p => { if (!p.skipDates) p.skipDates = []; });
  });

  // Fix 5: recategorise to new category scheme (Housework/Grooming/Fitness/Career/
  // Creativity/Relaxation/Social/Admin) + align group headings and a few renames.
  // Recategorise-only: does NOT add new presets or split Reading.
  apply('recategorise_v2', () => {
    const remapCat = c => CAT_MIGRATION[c] || c;
    (s.presets || []).forEach(p => { p.cat = remapCat(p.cat); });
    (s.inbox || []).forEach(i => { i.cat = remapCat(i.cat); });
    const ebd = s.eventsByDate || {};
    Object.keys(ebd).forEach(k => (ebd[k] || []).forEach(ev => { ev.cat = remapCat(ev.cat); }));
    const overrides = {
      p_hair:     { name: 'Haircare' },
      p_groom:    { name: 'Personal care' },
      p_jobapp:   { name: 'Application' },
      p_creative: { name: 'Arts & crafts' },
      p_mum:      { cat: 'social' },
      p_read_am:  { cat: 'relaxation', group: 'Creativity' },
      p_read_pm:  { cat: 'relaxation', group: 'Creativity' },
      p_screen:   { group: 'Creativity' },
      p_cook:     { cat: 'housework', group: 'Environment' },
      p_home:     { cat: 'housework', group: 'Environment' },
    };
    (s.presets || []).forEach(p => {
      const o = overrides[p.id];
      if (o) Object.assign(p, o);
      if (p.group === 'Creativity & Relaxation') p.group = 'Creativity';
    });
  });

  // Fix 6: self-heal scheduled-event categories. Any event created from a preset
  // should always carry that preset's CURRENT category. recategorise_v2 only ran a
  // generic old->new remap on events and missed the preset-specific overrides
  // (e.g. Call Mum -> social, Reading -> relaxation), so placed events could show
  // the wrong category. This re-syncs every preset-backed event to its preset.
  apply('resync_event_cats_v1', () => {
    const presetById = {};
    (s.presets || []).forEach(p => { presetById[p.id] = p; });
    const ebd = s.eventsByDate || {};
    Object.keys(ebd).forEach(k => (ebd[k] || []).forEach(ev => {
      if (ev.presetId && presetById[ev.presetId]) {
        ev.cat = presetById[ev.presetId].cat;
      }
      if (CAT_MIGRATION[ev.cat]) ev.cat = CAT_MIGRATION[ev.cat];
    }));
  });

  // Fix 7: Stretches is Fitness (default changed after some state was saved).
  // Force any preset with id p_stretch to fitness, then re-sync EVERY preset-backed
  // event to its preset's current category so placed blocks match the preset.
  apply('stretch_fitness_resync_v1', () => {
    const stretch = (s.presets || []).find(p => p.id === 'p_stretch');
    if (stretch) stretch.cat = 'fitness';
    const presetById = {};
    (s.presets || []).forEach(p => { presetById[p.id] = p; });
    const ebd = s.eventsByDate || {};
    Object.keys(ebd).forEach(k => (ebd[k] || []).forEach(ev => {
      if (ev.presetId && presetById[ev.presetId]) ev.cat = presetById[ev.presetId].cat;
    }));
  });

  localStorage.setItem(MIGRATION_KEY, JSON.stringify(applied));
}

function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) { console.error(e); }
}

function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getEvents(d) {
  const k = dateKey(d);
  if (!state.eventsByDate[k]) state.eventsByDate[k] = [];
  return state.eventsByDate[k];
}

// ============ AUTO-PLACE TIMED PRESETS ============
function autoPlaceTimedPresets(date) {
  const key = dateKey(date);
  if (state.autoPlacedDates[key]) return;
  const dow = date.getDay();
  const events = getEvents(date);
  state.presets.forEach(p => {
    if (!p.active || !p.time) return;
    if (!p.days || !p.days.includes(dow)) return;
    if ((p.skipDates || []).includes(key)) return;
    // Don't duplicate
    if (events.some(e => e.presetId === p.id)) return;
    const [h, m] = p.time.split(':').map(Number);
    events.push({
      id: 'e_' + p.id + '_' + key,
      title: p.name,
      cat: p.cat,
      hour: h + m/60,
      duration: p.duration,
      presetId: p.id,
      note: p.note || '',
      auto: true,
      completed: false
    });
  });
  state.autoPlacedDates[key] = true;
  saveState();
}

// ============ RESYNC PRESET-BACKED EVENTS ============
// Reconciles already-placed events with the CURRENT preset definitions so every
// view (today + week) stays in sync when a preset is toggled, edited, or deleted.
// Rules (chosen with the user): only touch TODAY and future dates — past days are
// left as a historical record — and never remove or re-time a COMPLETED event.
function resyncPresetEvents() {
  const todayKey = dateKey(new Date());               // 'YYYY-MM-DD' sorts chronologically
  const presetById = {};
  (state.presets || []).forEach(p => { presetById[p.id] = p; });

  Object.keys(state.eventsByDate || {}).forEach(k => {
    const isFuture = k >= todayKey;                    // today or later
    const dow = new Date(k + 'T00:00:00').getDay();
    let list = state.eventsByDate[k] || [];

    // Decide which events survive.
    list = list.filter(ev => {
      if (ev.completed) return true;                   // keep history, always
      // An auto-placed preset block has id 'e_<presetId>_<datekey>'. Detect that
      // shape so we can also clean up LEGACY blocks whose presetId field was never
      // stored. Manual (+) and inbox blocks use 'e_<timestamp>' and never match.
      const looksAuto = ev.auto === true || /_\d{4}-\d{2}-\d{2}$/.test(ev.id || '');
      if (!ev.presetId && !looksAuto) return true;     // genuine hand-made / inbox event
      if (!isFuture) return true;                      // never rewrite the past
      // From here down: a future, preset-derived block.
      const p = ev.presetId ? presetById[ev.presetId] : null;
      if (!p) return false;                            // backing preset deleted -> drop
      if (!p.active) return false;                     // preset paused -> drop
      if (looksAuto) {                                 // auto blocks follow day / skip / timing rules
        if ((p.skipDates || []).includes(k)) return false;
        if (p.days && !p.days.includes(dow)) return false;
        if (!p.time) return false;                     // no longer auto-placed -> lives in tray instead
      }
      return true;
    });

    // Push the current preset definition onto the survivors.
    list.forEach(ev => {
      if (!ev.presetId) return;
      const p = presetById[ev.presetId];
      if (!p) return;
      ev.title = p.name;
      ev.cat = p.cat;
      ev.note = p.note || ev.note;
      if (!ev.completed) {
        ev.duration = p.duration;
        const isAuto = ev.auto === true || ev.id === ('e_' + p.id + '_' + k);
        if (isAuto && p.time) {
          const [h, m] = p.time.split(':').map(Number);
          ev.hour = h + m / 60;
        }
      }
    });

    state.eventsByDate[k] = list;
  });

  // Let timed presets re-place themselves everywhere (autoPlace guards against dupes).
  state.autoPlacedDates = {};
  saveState();
}

// ============ FORMATTING ============
function formatHour(h) {
  const intH = Math.floor(h);
  const mins = Math.round((h - intH) * 60);
  const period = intH >= 12 ? 'pm' : 'am';
  const display = intH === 0 ? 12 : (intH > 12 ? intH - 12 : intH);
  return mins > 0 ? `${display}:${String(mins).padStart(2,'0')}${period}` : `${display}${period}`;
}

function formatDate(d) {
  return DAY_NAMES_FULL[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
}

function formatDuration(d) {
  const mins = Math.round(d * 60);
  if (mins < 60) return `${mins}m`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m ? `${h}h${m}m` : `${h}h`;
}

// ============ NAVIGATION ============
function updateTodayHeader() {
  const todayK = dateKey(new Date());
  const isToday = dateKey(state.currentDay) === todayK;
  document.getElementById('headerTitle').textContent = isToday ? 'Today' : DAY_NAMES_FULL[state.currentDay.getDay()];
  document.getElementById('headerDate').textContent = formatDate(state.currentDay);
}

let activeScreen = 'today';
function getActiveScreen() { return activeScreen; }

function updateWeekHeader() {
  const cur = new Date(state.currentDay);
  const dayIdx = (cur.getDay() + 6) % 7;
  const monday = new Date(cur.getTime() - dayIdx * 86400000);
  const sunday = new Date(monday.getTime() + 6 * 86400000);
  const todayK = dateKey(new Date());
  const containsToday = (() => {
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday.getTime() + i * 86400000);
      if (dateKey(d) === todayK) return true;
    }
    return false;
  })();
  document.getElementById('headerTitle').textContent = containsToday ? 'This week' : 'Week of';
  const sameMonth = monday.getMonth() === sunday.getMonth();
  const range = sameMonth
    ? `${MONTHS[monday.getMonth()]} ${monday.getDate()}–${sunday.getDate()}`
    : `${MONTHS[monday.getMonth()]} ${monday.getDate()} – ${MONTHS[sunday.getMonth()]} ${sunday.getDate()}`;
  document.getElementById('headerDate').textContent = range + ', ' + sunday.getFullYear();
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const screen = tab.dataset.screen;
    activeScreen = screen;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('screen-' + screen).classList.add('active');
    // Show prev/next/today nav on Today and Week screens
    document.getElementById('dayNav').style.display = (screen === 'today' || screen === 'week') ? 'flex' : 'none';
    updateScheduledTime();
    if (screen === 'today') {
      updateTodayHeader();
      renderAll();
    } else if (screen === 'week') {
      updateWeekHeader();
      renderWeek();
    } else {
      document.getElementById('headerTitle').textContent = tab.textContent.trim();
      const labels = { inbox: 'Inbox', presets: 'Presets', reflect: 'Weekly reflection' };
      document.getElementById('headerDate').textContent = labels[screen] || '';
      if (screen === 'inbox') renderInbox();
      if (screen === 'presets') renderPresets();
      if (screen === 'reflect') renderReflect();
    }
  });
});

function shiftCurrentDay(days) {
  state.currentDay = new Date(state.currentDay.getTime() + days * 86400000);
  saveState();
  if (activeScreen === 'week') {
    updateWeekHeader();
    renderWeek();
  } else {
    updateTodayHeader();
    renderAll();
  }
  updateScheduledTime();
}

document.getElementById('prevDay').addEventListener('click', () => {
  shiftCurrentDay(activeScreen === 'week' ? -7 : -1);
});
document.getElementById('nextDay').addEventListener('click', () => {
  shiftCurrentDay(activeScreen === 'week' ? 7 : 1);
});
document.getElementById('todayBtn').addEventListener('click', () => {
  state.currentDay = new Date();
  saveState();
  if (activeScreen === 'week') {
    updateWeekHeader();
    renderWeek();
  } else {
    updateTodayHeader();
    renderAll();
  }
  updateScheduledTime();
});

// ============ CALENDAR ============
// Find the half-hour slot key (hour + 0 or 0.5) closest to a given fractional hour.
function nearestHalfSlot(hour) {
  const snapped = Math.round(hour * 2) / 2;
  // Clamp to visible range
  if (snapped < 8) return { hour: 8, minute: 0 };
  if (snapped > 23.5) return { hour: 23, minute: 30 };
  const intH = Math.floor(snapped);
  const minute = (snapped - intH) >= 0.5 ? 30 : 0;
  return { hour: intH, minute };
}

function renderCalendar() {
  autoPlaceTimedPresets(state.currentDay);
  const area = document.getElementById('calendarArea');
  area.innerHTML = '';
  const SLOT_PX = 40;
  // Render two slots per hour: HH:00 and HH:30
  for (let h = 8; h <= 23; h++) {
    for (const minute of [0, 30]) {
      const row = document.createElement('div');
      row.className = 'hour-row ' + (minute === 0 ? 'is-hour' : 'is-half');
      const labelText = minute === 0
        ? formatHour(h)
        : '';
      const labelClass = minute === 0 ? 'hour-label' : 'hour-label half';
      row.innerHTML = `<div class="${labelClass}">${labelText}</div><div class="hour-slot" data-hour="${h}" data-minute="${minute}"></div>`;
      area.appendChild(row);
    }
  }
  const events = getEvents(state.currentDay);
  // Sort by start time so events within the same slot stack in chronological order
  const sortedEvents = events.slice().sort((a, b) => a.hour - b.hour);
  // Track which slots have events so we can disable tap-to-add on them
  const slotsWithEvents = new Set();
  const slotEventEls = new Map();
  sortedEvents.forEach(ev => {
    const place = nearestHalfSlot(ev.hour);
    const slot = area.querySelector(`.hour-slot[data-hour="${place.hour}"][data-minute="${place.minute}"]`);
    if (slot) {
      slotsWithEvents.add(place.hour + ':' + place.minute);
      const eventEl = document.createElement('div');
      eventEl.className = 'event cat-' + catCode(ev.cat)
        + (ev.completed ? ' completed' : '')
        + (ev.missed ? ' missed' : '');
      eventEl.dataset.id = ev.id;
      const noteIndicator = ev.note ? ' 📝' : '';
      eventEl.innerHTML = `
        <button class="complete-btn" data-event-id="${ev.id}" aria-label="Mark complete"></button>
        <div class="cat">${catLabel(ev.cat)}${ev.inboxId ? ' · inbox' : ''}${ev.presetId ? ' · preset' : ''}</div>
        <div>${ev.title}${noteIndicator}</div>
        <div class="time">${formatHour(ev.hour)} · ${formatDuration(ev.duration)}</div>
      `;
      eventEl.querySelector('.complete-btn').addEventListener('click', e => {
        e.stopPropagation();
        if (ev.missed) { showToast('Event missed — already back in inbox'); return; }
        toggleEventComplete(ev.id);
      });
      eventEl.addEventListener('click', e => { e.stopPropagation(); openEventModal(ev.id); });
      makeTouchDraggable(eventEl, {type: 'event', id: ev.id}, !ev.completed && !ev.missed);
      slot.appendChild(eventEl);
      const slotKey = place.hour + ':' + place.minute;
      if (!slotEventEls.has(slotKey)) slotEventEls.set(slotKey, []);
      slotEventEls.get(slotKey).push({el: eventEl, ev});
    }
  });
  // Mark slots that have events
  slotsWithEvents.forEach(key => {
    const [h, m] = key.split(':');
    const slot = area.querySelector(`.hour-slot[data-hour="${h}"][data-minute="${m}"]`);
    if (slot) slot.classList.add('has-events');
  });

  // === Proportional event heights ===
  // Each 30-min slot is SLOT_PX (40px). Rules:
  //   - Only events alone in their slot can resize.
  //   - Long events (>30 min) expand downward into consecutive empty slots
  //     (no overlap allowed); spill into a partly-available slot is fine.
  //   - Short events (<30 min) shrink proportionally, down to a readable floor.
  // Sized events get position:absolute so the grid stays uniform.
  const SHORT_FLOOR_PX = 32;
  const FULL_GAP = 2; // matches the slot padding so sized events don't kiss borders
  function isSlotEmpty(h, m) {
    if (h > 23) return false;
    return !slotsWithEvents.has(h + ':' + m);
  }
  slotEventEls.forEach((entries, key) => {
    if (entries.length !== 1) return; // only resize when this slot has a single event
    const {el, ev} = entries[0];
    if (ev.missed) return; // missed events keep default style (they get a label)
    const [hStr, mStr] = key.split(':');
    const startH = parseInt(hStr), startM = parseInt(mStr);
    const durationMin = Math.max(1, Math.round(ev.duration * 60));
    let heightPx = null;
    if (durationMin > 30) {
      // How many consecutive empty 30-min slots follow?
      let availableMin = 30; // own slot
      let h = startH, m = startM;
      while (availableMin < durationMin) {
        m += 30;
        if (m >= 60) { m = 0; h += 1; }
        if (!isSlotEmpty(h, m)) break;
        availableMin += 30;
      }
      const usableMin = Math.min(durationMin, availableMin);
      heightPx = (usableMin / 30) * SLOT_PX - FULL_GAP;
    } else if (durationMin < 30) {
      // Shrink, but floor so the labels stay readable
      const proportional = (durationMin / 30) * SLOT_PX - FULL_GAP;
      heightPx = Math.max(SHORT_FLOOR_PX, proportional);
    }
    if (heightPx !== null) {
      el.classList.add('sized');
      el.style.height = heightPx + 'px';
      // Mark slots that this expanded event now visually covers
      if (durationMin > 30) {
        let coveredMin = 30;
        let h = startH, m = startM;
        while (coveredMin < durationMin) {
          m += 30;
          if (m >= 60) { m = 0; h += 1; }
          if (!isSlotEmpty(h, m)) break;
          const coveredSlot = area.querySelector(`.hour-slot[data-hour="${h}"][data-minute="${m}"]`);
          if (coveredSlot) coveredSlot.classList.add('covered');
          coveredMin += 30;
        }
      }
    }
  });
  // Now line if viewing today
  const now = new Date();
  const isToday = dateKey(now) === dateKey(state.currentDay);
  if (isToday) {
    const h = now.getHours();
    const m = now.getMinutes();
    if (h >= 8 && h <= 23) {
      const minute = m >= 30 ? 30 : 0;
      const slot = area.querySelector(`.hour-slot[data-hour="${h}"][data-minute="${minute}"]`);
      if (slot) {
        const line = document.createElement('div');
        line.className = 'now-line';
        // Position within the half-hour slot (each slot covers 30 mins)
        const minsIntoSlot = m - minute;
        line.style.top = (minsIntoSlot / 30 * SLOT_PX) + 'px';
        slot.style.position = 'relative';
        slot.appendChild(line);
      }
    }
  }
  // Drop targets + tap-to-add
  area.querySelectorAll('.hour-slot').forEach(slot => {
    slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('drop-target'); });
    slot.addEventListener('dragleave', () => slot.classList.remove('drop-target'));
    slot.addEventListener('drop', e => {
      e.preventDefault();
      slot.classList.remove('drop-target');
      try {
        const data = JSON.parse(e.dataTransfer.getData('text/plain'));
        const baseHour = parseInt(slot.dataset.hour);
        const minute = parseInt(slot.dataset.minute);
        handleDrop(data, baseHour + minute / 60);
      } catch(err) {}
    });
    // Tap on empty area of slot opens new-event modal
    slot.addEventListener('click', e => {
      // Only fire if the click target IS the slot itself (not bubbled from an event)
      if (e.target === slot) {
        const baseHour = parseInt(slot.dataset.hour);
        const minute = parseInt(slot.dataset.minute);
        openNewEventModal(baseHour + minute / 60);
      }
    });
  });
  updateScheduledTime();
}

function updateScheduledTime() {
  const events = getEvents(state.currentDay);
  // Total time scheduled for the day (all events, regardless of completion).
  const totalH = events.reduce((s, e) => s + (e.duration || 0), 0);
  const el = document.getElementById('scheduledTime');
  const numEl = document.getElementById('scheduledTimeNum');
  if (!el || !numEl) return;
  numEl.textContent = formatDuration(totalH);
  if (totalH > 8) el.classList.add('busy'); else el.classList.remove('busy');
}

function toggleEventComplete(eventId) {
  const events = getEvents(state.currentDay);
  const ev = events.find(e => e.id === eventId);
  if (!ev) return;
  ev.completed = !ev.completed;
  if (ev.inboxId) {
    const task = state.inbox.find(t => t.id === ev.inboxId);
    if (task) {
      task.completed = ev.completed;
      showToast(ev.completed ? `"${task.label}" done ✓` : `"${task.label}" back in inbox`);
    }
  } else if (ev.presetId) {
    showToast(ev.completed ? 'Done ✓' : 'Marked incomplete');
  } else {
    showToast(ev.completed ? 'Done ✓' : 'Marked incomplete');
  }
  saveState();
  renderCalendar();
  renderInbox();
  renderTray();
}

function handleDrop(data, hour) {
  const events = getEvents(state.currentDay);
  if (data.type === 'preset') {
    const preset = state.presets.find(p => p.id === data.id);
    if (preset) {
      events.push({
        id: 'e_' + Date.now(),
        title: preset.name, cat: preset.cat, hour: hour,
        duration: preset.duration, presetId: preset.id,
        note: preset.note || '', completed: false
      });
      showToast(`"${preset.name}" added at ${formatHour(hour)}`);
    }
  } else if (data.type === 'inbox') {
    const task = state.inbox.find(t => t.id === data.id);
    if (task) {
      if (task.scheduledEventId) {
        const ev = events.find(e => e.id === task.scheduledEventId);
        if (ev) { ev.hour = hour; showToast(`Moved to ${formatHour(hour)}`); }
      } else {
        const newId = 'e_' + Date.now();
        events.push({
          id: newId, title: task.label, cat: task.cat, hour: hour,
          duration: task.duration || 0.5, inboxId: task.id,
          note: task.note || '', completed: false
        });
        task.scheduledEventId = newId;
        task.scheduledHour = hour;
        task.scheduledDate = dateKey(state.currentDay);
        showToast(`"${task.label}" scheduled`);
      }
    }
  } else if (data.type === 'event') {
    const ev = events.find(e => e.id === data.id);
    if (ev) {
      ev.hour = hour;
      if (ev.inboxId) {
        const task = state.inbox.find(t => t.id === ev.inboxId);
        if (task) task.scheduledHour = hour;
      }
      showToast(`Moved to ${formatHour(hour)}`);
    }
  }
  saveState();
  renderCalendar();
  renderInbox();
  renderTray();
}

// ============ NEW EVENT MODAL (tap empty hour) ============
function openNewEventModal(hour) {
  const modal = document.getElementById('modalContent');
  const dateLabel = formatDate(state.currentDay);
  const intH = Math.floor(hour);
  const mins = Math.round((hour - intH) * 60);
  const timeStr = String(intH).padStart(2,'0') + ':' + String(mins).padStart(2,'0');
  modal.innerHTML = `
    <h3>New event</h3>
    <div style="font-size:12px; color:#888; margin-bottom:10px;">${dateLabel}</div>
    <label>What is it?</label>
    <input type="text" id="neTitle" placeholder="e.g. Call with Sarah" autofocus>
    <label>Category</label>
    <select id="neCat">${Object.entries(CAT_LABELS).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}</select>
    <label>Time</label>
    <input type="time" id="neTime" value="${timeStr}">
    <label>Duration (minutes)</label>
    <input type="number" id="neDur" value="30" min="5" step="5">
    <label>Notes (optional)</label>
    <textarea id="neNote"></textarea>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveNewEvent()">Add</button>
    </div>
  `;
  document.getElementById('modalBg').classList.add('show');
  setTimeout(() => { const el = document.getElementById('neTitle'); if (el) el.focus(); }, 50);
}

function saveNewEvent() {
  const title = document.getElementById('neTitle').value.trim();
  if (!title) { showToast('Add a title'); return; }
  const cat = document.getElementById('neCat').value;
  const t = document.getElementById('neTime').value || '09:00';
  const [h, m] = t.split(':').map(Number);
  const dur = parseInt(document.getElementById('neDur').value);
  if (!dur || dur < 5) { showToast('Duration too short'); return; }
  const note = document.getElementById('neNote').value.trim();
  const events = getEvents(state.currentDay);
  events.push({
    id: 'e_' + Date.now(),
    title, cat,
    hour: h + m/60,
    duration: dur / 60,
    note, completed: false
  });
  saveState();
  closeModal();
  renderCalendar();
  showToast(`"${title}" added at ${formatHour(h + m/60)}`);
}

// ============ EVENT MODAL (notes, edit, delete) ============
function openEventModal(eventId) {
  const events = getEvents(state.currentDay);
  const ev = events.find(e => e.id === eventId);
  if (!ev) return;
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <h3>${ev.title}</h3>
    <div style="font-size:12px; color:#888; margin-bottom:10px;">${catLabel(ev.cat)} · ${formatHour(ev.hour)} · ${formatDuration(ev.duration)}</div>
    <label>Notes</label>
    <textarea id="eventNote" placeholder="Add notes for this task…">${ev.note || ''}</textarea>
    <label>Time</label>
    <input type="time" id="eventTime" value="${String(Math.floor(ev.hour)).padStart(2,'0')}:${String(Math.round((ev.hour%1)*60)).padStart(2,'0')}">
    <label>Duration (minutes)</label>
    <input type="number" id="eventDuration" value="${Math.round(ev.duration * 60)}" min="5" step="5">
    <div class="modal-actions">
      <button class="btn-danger" onclick="deleteEvent('${ev.id}')">Delete</button>
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveEvent('${ev.id}')">Save</button>
    </div>
  `;
  document.getElementById('modalBg').classList.add('show');
}

function saveEvent(eventId) {
  const events = getEvents(state.currentDay);
  const ev = events.find(e => e.id === eventId);
  if (!ev) return;
  ev.note = document.getElementById('eventNote').value.trim();
  const t = document.getElementById('eventTime').value;
  if (t) {
    const [h, m] = t.split(':').map(Number);
    ev.hour = h + m/60;
  }
  const d = parseInt(document.getElementById('eventDuration').value);
  if (d > 0) ev.duration = d / 60;
  // Sync to linked inbox task
  if (ev.inboxId) {
    const task = state.inbox.find(t => t.id === ev.inboxId);
    if (task) { task.note = ev.note; task.scheduledHour = ev.hour; }
  }
  saveState();
  closeModal();
  renderCalendar();
  showToast('Saved');
}

function deleteEvent(eventId) {
  const k = dateKey(state.currentDay);
  const events = state.eventsByDate[k] || [];
  const ev = events.find(e => e.id === eventId);
  if (!ev) return;
  // If linked to inbox, restore the inbox link
  if (ev.inboxId) {
    const task = state.inbox.find(t => t.id === ev.inboxId);
    if (task) { task.scheduledEventId = null; task.scheduledHour = null; task.scheduledDate = null; }
  }
  state.eventsByDate[k] = events.filter(e => e.id !== eventId);
  saveState();
  closeModal();
  renderCalendar();
  renderInbox();
  renderTray();
  showToast('Deleted');
}

// ============ TRAY ============
function isPresetSkippedToday(p) {
  const k = dateKey(state.currentDay);
  return (p.skipDates || []).includes(k);
}

function isPresetAllocatedToday(p) {
  const events = getEvents(state.currentDay);
  return events.some(e => e.presetId === p.id);
}

function renderTray() {
  const scroll = document.getElementById('trayScroll');
  scroll.innerHTML = '';
  const dow = state.currentDay.getDay();
  if (state.trayMode === 'presets') {
    // Draggable presets that apply today, NOT skipped today.
    const draggable = state.presets.filter(p => p.active && !p.time && (!p.days || p.days.includes(dow)) && !isPresetSkippedToday(p));
    // Timed presets that apply today but whose auto-placed block has been REMOVED
    // from this day reappear in the tray so they can be re-placed by hand.
    const removedTimed = state.presets.filter(p => p.active && p.time && (!p.days || p.days.includes(dow)) && !isPresetSkippedToday(p) && !isPresetAllocatedToday(p));
    const all = draggable.concat(removedTimed);
    const available = all.filter(p => !isPresetAllocatedToday(p));
    const allocated = all.filter(p => isPresetAllocatedToday(p));
    if (all.length === 0) {
      scroll.innerHTML = `<div style="color:#aaa; font-size:12px; padding:8px;">No draggable presets for today.</div>`;
      return;
    }
    available.forEach(item => scroll.appendChild(makePresetTrayItem(item, false)));
    allocated.forEach(item => scroll.appendChild(makePresetTrayItem(item, true)));
  } else {
    const allInbox = state.inbox.filter(i => !i.completed);
    const available = allInbox.filter(i => !i.scheduledEventId);
    const allocated = allInbox.filter(i => i.scheduledEventId);
    if (allInbox.length === 0) {
      scroll.innerHTML = `<div style="color:#aaa; font-size:12px; padding:8px;">Inbox empty. Tap + to add a task.</div>`;
      return;
    }
    available.forEach(item => scroll.appendChild(makeInboxTrayItem(item, false)));
    allocated.forEach(item => scroll.appendChild(makeInboxTrayItem(item, true)));
  }
}

function makePresetTrayItem(item, allocated) {
  const el = document.createElement('div');
  el.className = 'tray-item cat-' + catCode(item.cat) + (allocated ? ' allocated' : '');
  el.innerHTML = `
    <button class="tray-item-close" data-action="skip" aria-label="${allocated ? 'Remove from today' : 'Skip today'}">×</button>
    <div class="label">${item.name}</div>
    <div class="meta">${formatDuration(item.duration)} · ${item.cadence}</div>
    ${allocated ? '<div class="allocated-tag">✓ on today</div>' : (item.note ? '<div class="age" style="color:#8b6d3f;">📝 has note</div>' : '')}
  `;
  el.querySelector('[data-action="skip"]').addEventListener('click', e => {
    e.stopPropagation();
    if (allocated) {
      // Remove the scheduled instance(s) from today
      const events = getEvents(state.currentDay);
      state.eventsByDate[dateKey(state.currentDay)] = events.filter(ev => ev.presetId !== item.id);
      saveState();
      renderCalendar();
      renderTray();
      showToast(`"${item.name}" removed from today`);
    } else {
      // Skip today: hide from tray, won't auto-place
      const k = dateKey(state.currentDay);
      if (!item.skipDates) item.skipDates = [];
      if (!item.skipDates.includes(k)) item.skipDates.push(k);
      saveState();
      renderTray();
      showToast(`"${item.name}" skipped for today`);
    }
  });
  if (allocated) {
    // Tap to jump to the event on calendar
    el.addEventListener('click', () => {
      const events = getEvents(state.currentDay);
      const ev = events.find(e => e.presetId === item.id);
      if (ev) openEventModal(ev.id);
    });
  } else {
    makeTouchDraggable(el, {type: 'preset', id: item.id}, true);
  }
  return el;
}

function makeInboxTrayItem(item, allocated) {
  const el = document.createElement('div');
  el.className = 'tray-item cat-' + catCode(item.cat) + (allocated ? ' allocated' : '');
  el.innerHTML = `
    <button class="tray-item-close" data-action="delete" aria-label="Delete task">×</button>
    <div class="label">${item.label}</div>
    <div class="meta">${catLabel(item.cat)} · ${item.age || 0}d old</div>
    ${allocated ? '<div class="allocated-tag">✓ scheduled</div>' : (item.age >= 14 ? '<div class="age">stale — triage?</div>' : '')}
  `;
  el.querySelector('[data-action="delete"]').addEventListener('click', e => {
    e.stopPropagation();
    // If the task is scheduled, also remove its event from the calendar
    if (item.scheduledEventId && item.scheduledDate) {
      const events = state.eventsByDate[item.scheduledDate] || [];
      state.eventsByDate[item.scheduledDate] = events.filter(ev => ev.id !== item.scheduledEventId);
    }
    state.inbox = state.inbox.filter(i => i.id !== item.id);
    saveState();
    renderCalendar();
    renderTray();
    renderInbox();
    showToast(`"${item.label}" deleted`);
  });
  if (allocated) {
    el.addEventListener('click', () => {
      if (item.scheduledDate && item.scheduledDate !== dateKey(state.currentDay)) {
        // Jump to that day first
        state.currentDay = new Date(item.scheduledDate + 'T00:00:00');
        saveState();
        updateTodayHeader();
        renderAll();
      }
      const events = getEvents(state.currentDay);
      const ev = events.find(e => e.id === item.scheduledEventId);
      if (ev) openEventModal(ev.id);
    });
  } else {
    makeTouchDraggable(el, {type: 'inbox', id: item.id}, true);
  }
  return el;
}

// ============ TOUCH DRAG ============
// Custom touch drag system: long-press to lift, then drag to slot
function makeTouchDraggable(el, payload, enabled) {
  if (!enabled) return;
  // HTML5 drag (desktop)
  el.draggable = true;
  el.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', JSON.stringify(payload));
  });
  // Touch drag (mobile)
  let touchStart = null;
  let dragClone = null;
  let longPressTimer = null;
  let isDragging = false;
  let scrollDetected = false;

  function cleanup() {
    clearTimeout(longPressTimer);
    longPressTimer = null;
    if (dragClone) { dragClone.remove(); dragClone = null; }
    el.style.opacity = '';
    document.querySelectorAll('.hour-slot').forEach(s => s.classList.remove('drop-target'));
    touchStart = null;
    isDragging = false;
    scrollDetected = false;
  }

  el.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY, time: Date.now() };
    scrollDetected = false;
    isDragging = false;
    longPressTimer = setTimeout(() => {
      // Only start drag if user hasn't started scrolling
      if (scrollDetected || !touchStart) return;
      isDragging = true;
      if (navigator.vibrate) navigator.vibrate(30);
      dragClone = el.cloneNode(true);
      dragClone.classList.add('dragging-touch');
      const r = el.getBoundingClientRect();
      dragClone.style.width = r.width + 'px';
      dragClone.style.left = (t.clientX - r.width/2) + 'px';
      dragClone.style.top = (t.clientY - r.height/2) + 'px';
      document.body.appendChild(dragClone);
      el.style.opacity = '0.3';
    }, 350);
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    if (!touchStart) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (!isDragging) {
      // Any movement before drag starts = scroll. Cancel the timer.
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
        scrollDetected = true;
        clearTimeout(longPressTimer);
        longPressTimer = null;
        touchStart = null;
      }
      return;
    }
    // Dragging — prevent scroll, move clone
    e.preventDefault();
    if (dragClone) {
      const r = el.getBoundingClientRect();
      dragClone.style.left = (t.clientX - r.width/2) + 'px';
      dragClone.style.top = (t.clientY - r.height/2) + 'px';
    }
    document.querySelectorAll('.hour-slot').forEach(s => s.classList.remove('drop-target'));
    const below = document.elementFromPoint(t.clientX, t.clientY);
    if (below) {
      const slot = below.closest('.hour-slot');
      if (slot) slot.classList.add('drop-target');
    }
  }, { passive: false });

  el.addEventListener('touchend', e => {
    if (!isDragging) { cleanup(); return; }
    const t = e.changedTouches[0];
    const below = document.elementFromPoint(t.clientX, t.clientY);
    if (below) {
      const slot = below.closest('.hour-slot');
      if (slot) {
        const baseHour = parseInt(slot.dataset.hour);
        const minute = parseInt(slot.dataset.minute) || 0;
        handleDrop(payload, baseHour + minute / 60);
      }
    }
    cleanup();
  });

  el.addEventListener('touchcancel', () => {
    cleanup();
    touchStart = null; isDragging = false;
  });
}

// ============ END OF DAY ============
function runEndOfDay() {
  // Confirm first
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <h3>End the day?</h3>
    <p style="font-size:13px; color:#555; margin: 0 0 12px;">This will:</p>
    <ul style="font-size:12px; color:#555; margin: 0 0 14px 20px; padding: 0;">
      <li>Resurface any scheduled-but-incomplete inbox tasks</li>
      <li>Mark incomplete preset blocks as missed</li>
      <li>Bump preset skip-streaks for anything not done</li>
    </ul>
    <p style="font-size:12px; color:#888; margin: 0 0 14px;">You'll have 30 seconds to undo.</p>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="closeModal(); executeEndOfDay();">Yes, end the day</button>
    </div>
  `;
  document.getElementById('modalBg').classList.add('show');
}

function executeEndOfDay() {
  const events = getEvents(state.currentDay);
  // Snapshot for undo
  const snapshot = {
    dateKey: dateKey(state.currentDay),
    timestamp: Date.now(),
    events: JSON.parse(JSON.stringify(events)),
    inbox: JSON.parse(JSON.stringify(state.inbox)),
    presetStreaks: state.presets.map(p => ({ id: p.id, skipStreak: p.skipStreak || 0 }))
  };
  if (!state.eodSnapshots) state.eodSnapshots = {};
  state.eodSnapshots[snapshot.dateKey] = snapshot;
  state.lastEodSnapshot = snapshot;

  let resurfaced = 0;
  let presetMissed = 0;
  state.inbox.forEach(task => {
    if (task.scheduledEventId && !task.completed) {
      const ev = events.find(e => e.id === task.scheduledEventId);
      if (ev && !ev.completed) {
        task.scheduledEventId = null; task.scheduledHour = null; task.scheduledDate = null;
        task.age = (task.age || 0) + 1;
        ev.missed = true;
        resurfaced++;
      }
    }
  });
  events.forEach(ev => {
    if (ev.presetId && !ev.completed && !ev.missed) {
      const p = state.presets.find(x => x.id === ev.presetId);
      if (p) { p.skipStreak = (p.skipStreak || 0) + 1; presetMissed++; }
      ev.missed = true;
    } else if (ev.presetId && ev.completed) {
      const p = state.presets.find(x => x.id === ev.presetId);
      if (p) p.skipStreak = 0;
    }
  });
  state.inbox.forEach(t => { if (!t.scheduledEventId && !t.completed) t.age = (t.age || 0) + 1; });
  saveState();
  renderCalendar(); renderInbox(); renderTray(); renderPresets(); updateEodButton();

  let msg = `End of day. `;
  if (resurfaced) msg += `${resurfaced} task${resurfaced>1?'s':''} resurfaced. `;
  if (presetMissed) msg += `${presetMissed} preset${presetMissed>1?'s':''} skipped.`;
  if (!resurfaced && !presetMissed) msg += `All clear ✓`;
  showUndoToast(msg.trim());
}

function showUndoToast(msg) {
  // Sticky toast with undo button, 30s window
  const existing = document.getElementById('undoToast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.id = 'undoToast';
  t.className = 'toast show';
  t.style.background = '#2a2a2a';
  t.innerHTML = `<span>${msg}</span> <button id="undoEodBtn" style="background:#c4b5d4; color:#2a1f3a; border:none; padding:6px 12px; border-radius:14px; font-size:12px; font-weight:600; margin-left:10px; cursor:pointer;">Undo</button>`;
  document.body.appendChild(t);
  document.getElementById('undoEodBtn').addEventListener('click', () => {
    undoEndOfDay();
    t.remove();
  });
  setTimeout(() => {
    if (document.getElementById('undoToast')) {
      document.getElementById('undoToast').remove();
    }
  }, 30000);
}

function undoEndOfDay(dk) {
  const key = dk || dateKey(state.currentDay);
  const snap = (state.eodSnapshots && state.eodSnapshots[key]) || state.lastEodSnapshot;
  if (!snap) { showToast('Nothing to undo'); return; }
  // Restore events for that day
  state.eventsByDate[snap.dateKey] = snap.events;
  // Restore inbox
  state.inbox = snap.inbox;
  // Restore preset skip streaks
  snap.presetStreaks.forEach(ps => {
    const p = state.presets.find(x => x.id === ps.id);
    if (p) p.skipStreak = ps.skipStreak;
  });
  // Clear the persistent record for this day
  if (state.eodSnapshots) delete state.eodSnapshots[snap.dateKey];
  if (state.lastEodSnapshot && state.lastEodSnapshot.dateKey === snap.dateKey) state.lastEodSnapshot = null;
  const ut = document.getElementById('undoToast'); if (ut) ut.remove();
  saveState();
  renderCalendar(); renderInbox(); renderTray(); renderPresets(); updateEodButton();
  showToast('End-of-day undone ✓');
}

// Has end-of-day been run (and not undone) for the day currently in view?
function hasEodRecord(dk) {
  const key = dk || dateKey(state.currentDay);
  return !!(state.eodSnapshots && state.eodSnapshots[key]);
}

// Button routes to either running EOD or undoing it, based on the viewed day.
function onEodButton() {
  if (hasEodRecord()) undoEndOfDay();
  else runEndOfDay();
}

// Relabel the Today-screen EOD button to match the viewed day's state.
function updateEodButton() {
  const btn = document.getElementById('eodBtn');
  if (!btn) return;
  if (hasEodRecord()) { btn.textContent = '↩ Undo end of day'; }
  else { btn.textContent = '⏰ End of day'; }
}

// ============ WEEK VIEW ============
function renderWeek() {
  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';
  // Find Monday of current week
  const cur = new Date(state.currentDay);
  const dayIdx = (cur.getDay() + 6) % 7; // 0=Mon
  const monday = new Date(cur.getTime() - dayIdx * 86400000);
  const days = [];
  for (let i = 0; i < 7; i++) days.push(new Date(monday.getTime() + i * 86400000));
  const todayKey = dateKey(new Date());
  // Auto-place for all days in view
  days.forEach(d => autoPlaceTimedPresets(d));

  const HOUR_PX = 26;        // pixels per hour
  const MIN_PX = 11;         // readable floor for very short blocks
  const DAY_START = 8;       // visible window: 8am ..
  const DAY_END = 24;        // .. midnight
  const COL_H = (DAY_END - DAY_START) * HOUR_PX;

  // Row 1: header (empty corner + 7 day headers)
  grid.appendChild(makeCell('week-day-header', ''));
  days.forEach((d) => {
    const isToday = dateKey(d) === todayKey;
    const cell = makeCell('week-day-header' + (isToday ? ' today' : ''), `${DAY_NAMES[d.getDay()]}<span class="num">${d.getDate()}</span>`);
    cell.addEventListener('click', () => {
      state.currentDay = d;
      document.querySelector('.tab[data-screen="today"]').click();
    });
    grid.appendChild(cell);
  });

  // Row 2, first column: hour labels
  const times = document.createElement('div');
  times.className = 'week-times';
  times.style.height = COL_H + 'px';
  for (let h = DAY_START; h < DAY_END; h++) {
    const lab = document.createElement('div');
    lab.className = 'week-hr';
    lab.textContent = formatHour(h);
    times.appendChild(lab);
  }
  grid.appendChild(times);

  // Row 2: one continuous timeline column per day.
  days.forEach(d => {
    const col = document.createElement('div');
    col.className = 'week-daycol';
    col.style.height = COL_H + 'px';

    // Events overlapping the visible window, positioned by true start/end.
    const items = getEvents(d)
      .filter(e => (e.hour + (e.duration || 0.5)) > DAY_START && e.hour < DAY_END)
      .map(e => ({
        e,
        start: Math.max(e.hour, DAY_START),
        end: Math.min(e.hour + (e.duration || 0.5), DAY_END)
      }))
      .sort((a, b) => a.start - b.start || a.end - b.end);

    // Only genuinely time-overlapping events share width; sequential ones stay full width.
    assignOverlapColumns(items);

    items.forEach(item => {
      const e = item.e;
      const dur = e.duration || 0.5;
      const wpct = 100 / item.ncols;
      const div = document.createElement('div');
      div.className = 'week-event week-event-tall cat-' + catCode(e.cat);
      div.textContent = e.title;
      div.title = e.title + ' \u00b7 ' + formatDuration(dur);
      div.style.top = ((item.start - DAY_START) * HOUR_PX + 1) + 'px';
      div.style.height = Math.max(MIN_PX, (item.end - item.start) * HOUR_PX - 1) + 'px';
      div.style.left = 'calc(' + (item.col * wpct) + '% + 1px)';
      div.style.width = 'calc(' + wpct + '% - 2px)';
      div.style.right = 'auto';
      col.appendChild(div);
    });

    grid.appendChild(col);
  });
}

// Greedy interval-graph colouring. Events that overlap in time get separate
// columns and share the width; events that merely touch (one ends exactly when
// the next starts) or are disjoint keep the full width and stack vertically.
// Mutates each item with { col, ncols }.
function assignOverlapColumns(items) {
  const EPS = 1e-6;
  let cluster = [];
  let clusterEnd = -Infinity;
  function flush() {
    const colEnds = [];                 // last end-time placed in each column
    cluster.forEach(it => {
      let placed = false;
      for (let c = 0; c < colEnds.length; c++) {
        if (it.start >= colEnds[c] - EPS) { it.col = c; colEnds[c] = it.end; placed = true; break; }
      }
      if (!placed) { it.col = colEnds.length; colEnds.push(it.end); }
    });
    const ncols = colEnds.length;
    cluster.forEach(it => { it.ncols = ncols; });
    cluster = [];
  }
  items.forEach(it => {
    if (cluster.length && it.start >= clusterEnd - EPS) { flush(); clusterEnd = -Infinity; }
    cluster.push(it);
    clusterEnd = Math.max(clusterEnd, it.end);
  });
  if (cluster.length) flush();
}

// Long-press drag-to-reorder for inbox items, scoped within one section.
function enableInboxDrag(section) {
  let dragEl = null, startY = 0, longPressTimer = null, active = false;
  let pointerId = null, offsetY = 0;

  function items() {
    return Array.from(section.querySelectorAll('.inbox-item'));
  }

  function onPointerDown(e) {
    const handle = e.target.closest('[data-handle]');
    const itemEl = e.target.closest('.inbox-item');
    if (!itemEl || !section.contains(itemEl)) return;
    // On touch require the handle; mouse can grab anywhere on the handle too.
    if (!handle) return;
    e.preventDefault();
    pointerId = e.pointerId;
    startY = e.clientY;
    const begin = () => {
      active = true;
      dragEl = itemEl;
      dragEl.classList.add('dragging');
      try { itemEl.setPointerCapture(pointerId); } catch (err) {}
    };
    // Small delay so a tap/scroll isn't treated as a drag.
    longPressTimer = setTimeout(begin, 120);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
  }

  function onPointerMove(e) {
    if (e.pointerId !== pointerId) return;
    if (!active) {
      // If finger moves a lot before long-press fires, cancel (it's a scroll).
      if (Math.abs(e.clientY - startY) > 8) cleanup();
      return;
    }
    e.preventDefault();
    const y = e.clientY;
    const others = items().filter(el => el !== dragEl);
    let placed = false;
    for (const el of others) {
      const r = el.getBoundingClientRect();
      if (y < r.top + r.height / 2) {
        section.insertBefore(dragEl, el);
        placed = true;
        break;
      }
    }
    if (!placed) section.appendChild(dragEl);
  }

  function onPointerUp(e) {
    if (e.pointerId !== pointerId) return;
    if (active) commitOrder();
    cleanup();
  }

  function commitOrder() {
    const orderedIds = items().map(el => el.dataset.id);
    const idSet = new Set(orderedIds);
    const byId = {};
    state.inbox.forEach(t => { byId[t.id] = t; });
    // Reorder only this section's items within state.inbox, leaving
    // all other items in their original array slots.
    let q = 0;
    state.inbox = state.inbox.map(t => idSet.has(t.id) ? byId[orderedIds[q++]] : t);
    saveState();
  }

  function cleanup() {
    clearTimeout(longPressTimer);
    if (dragEl) dragEl.classList.remove('dragging');
    if (dragEl && pointerId != null) { try { dragEl.releasePointerCapture(pointerId); } catch (err) {} }
    dragEl = null; active = false; pointerId = null;
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    window.removeEventListener('pointercancel', onPointerUp);
  }

  section.addEventListener('pointerdown', onPointerDown);
}
